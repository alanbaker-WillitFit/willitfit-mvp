<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0D1B3D" />
  <title>Four to Fly | WillIt Lab</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">WillIt Lab</p>
        <h1>Four to <span>Fly</span></h1>
        <p>Load four WillIt tokens in a row before your opponent.</p>
      </div>
      <a href="/fly" class="back-link">Back to WillItFly</a>
    </header>

    <section class="controls" aria-label="Game options">
      <div class="segmented" role="group" aria-label="Game mode">
        <button type="button" class="mode active" data-mode="cpu">Vs CPU</button>
        <button type="button" class="mode" data-mode="local">2 Players</button>
      </div>
      <label class="difficulty-wrap">CPU
        <select id="difficulty" aria-label="CPU difficulty">
          <option value="easy">Easy</option>
          <option value="standard" selected>Standard</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <button type="button" id="newMatch" class="secondary">New match</button>
    </section>

    <section class="scoreboard" aria-label="Match score">
      <div class="score player-one"><span class="mini-token approval"></span><strong>You</strong><b id="scoreP1">0</b></div>
      <div class="status" id="status" role="status" aria-live="polite">Your turn</div>
      <div class="score player-two"><span class="mini-token navy">it</span><strong id="p2Label">CPU</strong><b id="scoreP2">0</b></div>
    </section>

    <section class="game-card">
      <div id="columnButtons" class="column-buttons" aria-label="Choose a column"></div>
      <div id="board" class="board" role="grid" aria-label="Four to Fly board"></div>
      <p class="hint">Tap a column, or use ← → and Enter.</p>
    </section>

    <footer>
      <button type="button" id="playAgain" class="primary">Restart round</button>
      <p>Connect four horizontally, vertically or diagonally.</p>
    </footer>
  </main>

  <script src="../bag-bounce/asset-refs.js"></script>
  <script src="game.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
