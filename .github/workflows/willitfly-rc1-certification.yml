name: WillItFly RC1 Certification

on:
  push:
    branches:
      - willitfly-rc1-cleanse-20260813
      - willitfly-rc1-globe-hero-20260817
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: willitfly-rc1-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Install and certify isolated WillItFly RC1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout WillItFly RC1 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Record environment
        run: |
          node --version
          npm --version
          git branch --show-current
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: npm ci

      # Feature-branch certification must execute against the exact implementation head.
      - name: Certify WillItFly RC1 boundary
        run: npm run verify:willitfly
