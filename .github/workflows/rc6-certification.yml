name: RC6 Certification

on:
  push:
    branches:
      - rc6-build-audit-20260819
    paths:
      - '**'
  pull_request:
    branches:
      - rc6-certification-base-20260819
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Install, check, test and build RC6
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC6 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Record environment
        run: |
          node --version
          npm --version
          git branch --show-current
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Preview production audit remediation
        continue-on-error: true
        run: npm audit fix --omit=dev --dry-run

      - name: Audit full dependency tree
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Preview full-tree audit remediation
        continue-on-error: true
        run: npm audit fix --dry-run

      - name: Validate RC6 projection contract
        run: npm run publisher:rc6:dry-run

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build locally
        run: npm run build
