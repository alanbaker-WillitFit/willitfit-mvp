name: RC6 Certification

on:
  push:
    branches:
      - rc6-build-audit-20260819
    paths:
      - '**'
  pull_request:
    branches:
      - rc6-certification-base-20260819
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Install, check, test and build RC6
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC6 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Record environment
        run: |
          node --version
          npm --version
          git branch --show-current
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Preview production audit remediation
        continue-on-error: true
        run: npm audit fix --omit=dev --dry-run

      - name: Audit full dependency tree
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Preview full-tree audit remediation
        continue-on-error: true
        run: npm audit fix --dry-run

      - name: Validate RC6 projection contract
        run: npm run publisher:rc6:dry-run

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build locally
        run: npm run build

  dependency-candidate:
    name: Generate and verify dependency candidate
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC6 branch
        uses: actions/checkout@v4
        with:
          ref: rc6-build-audit-20260819

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install current locked dependencies
        run: npm ci

      - name: Apply explicit dependency candidate
        run: |
          npm install --save-exact @opennextjs/cloudflare@1.20.2 next@16.3.1
          npm install --save-dev --save-exact eslint-config-next@15.5.23 postcss@8.5.26 wrangler@4.124.0
          npm uninstall --save-dev xlsx
          npm pkg set engines.node=">=22"
          npm pkg set scripts.lint="eslint . --ext .js,.jsx,.ts,.tsx"
          npm update brace-expansion nanoid js-yaml

      - name: Record resolved candidate versions
        run: |
          node --version
          npm --version
          npm ls @opennextjs/cloudflare next eslint-config-next wrangler miniflare workerd sharp undici nanoid postcss brace-expansion js-yaml --all || true

      - name: Audit production candidate
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full candidate
        run: npm audit --audit-level=high

      - name: Validate projection contract on candidate
        run: npm run publisher:rc6:dry-run

      - name: Type-check candidate
        run: npm run type-check

      - name: Lint candidate
        run: npm run lint

      - name: Test candidate
        run: npm test

      - name: Build Next.js candidate
        run: npm run build

      - name: Build OpenNext Cloudflare candidate
        run: npm run build:cf

      - name: Upload dependency candidate files
        uses: actions/upload-artifact@v4
        with:
          name: rc6-dependency-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
