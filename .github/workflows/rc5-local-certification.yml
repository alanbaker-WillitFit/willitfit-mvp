name: RC5 Local Certification

on:
  push:
    branches:
      - rc5-cleanse-baseline
      - rc5-build-sprint
      - rc5-stage-1-articles
    paths:
      - '**'
  pull_request:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc5-local-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Install, check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout RC5 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Record environment
        run: |
          node --version
          npm --version
          git branch --show-current
          git rev-parse HEAD
          git status --short

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build locally
        run: npm run build
