name: Restore governed WillItFly assets

on:
  push:
    branches:
      - willitfly-rc1-cleanse-20260813
    paths:
      - .github/workflows/restore-willitfly-assets.yml

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanse branch
        uses: actions/checkout@v4
        with:
          ref: willitfly-rc1-cleanse-20260813
          fetch-depth: 0

      - name: Download governed Drive originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/fly/map public/assets/fly/markers
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1eQw3zd7QsrtxIp3C3h4RLdX4CJD7bNJk&export=download&confirm=t' -o public/assets/fly/map/willitfly-hero-world-map.png
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1Lyk6P6vSL5N5IA2USbEfn9XuKm2h2Dw3&export=download&confirm=t' -o public/assets/fly/markers/location-marker-1.jpeg
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1Z_sXHK1hkdfT-MrEc1Be6FBB0inAgYQw&export=download&confirm=t' -o public/assets/fly/markers/location-marker-2.jpeg
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1yNGdf4ogmit_-_5QjeaedJRBNflRUZdu&export=download&confirm=t' -o public/assets/fly/markers/location-marker-3.png

      - name: Verify exact original hashes
        shell: bash
        run: |
          set -euo pipefail
          echo 'af6094101d35c3a72a6cce331556393a148bb7169c16831a50670491cf4e657b  public/assets/fly/map/willitfly-hero-world-map.png' | sha256sum -c -
          echo '41adae3bd147fa88736a97ea93f08723e0e59181e0f3fc53d1008f602b440130  public/assets/fly/markers/location-marker-1.jpeg' | sha256sum -c -
          echo '247e060c5dcfcc24c7a9a0ce54b34f5975f2bcc1ba357c505dd1f1d1c6e9a559  public/assets/fly/markers/location-marker-2.jpeg' | sha256sum -c -
          echo '4257d9b68aedc433f77132aea206a63e663b964811e918928ece4d624c33f7d2  public/assets/fly/markers/location-marker-3.png' | sha256sum -c -

      - name: Commit restored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/fly/map/willitfly-hero-world-map.png \
                  public/assets/fly/markers/location-marker-1.jpeg \
                  public/assets/fly/markers/location-marker-2.jpeg \
                  public/assets/fly/markers/location-marker-3.png
          if git diff --cached --quiet; then
            echo 'Governed assets already match; no commit required.'
            exit 0
          fi
          git commit -m 'assets(willitfly): restore governed map and marker originals'
          git push origin HEAD:willitfly-rc1-cleanse-20260813
